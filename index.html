<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grupo Líder — Recibos de Entrega</title>
    <script>
      // Aplica o tema salvo antes da página desenhar, pra não piscar claro→escuro no carregamento.
      try {
        if (localStorage.getItem('recibos-escolas:tema') === 'escuro') {
          document.documentElement.classList.add('dark');
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
